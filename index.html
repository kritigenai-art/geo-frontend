  <!-- ============================================================
       JSON-LD — FAQ PAGE (Rich Snippets)
  ============================================================ -->
  <script type="application/ld+json" id="json-ld-faq">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is TravelGo AI?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "TravelGo AI is a free, browser-based travel companion that uses your GPS location and open data APIs to show real-time weather, hotel prices, travel times (car/bus/train), and Wikipedia-powered city guides for any destination worldwide."
        }
      },
      {
        "@type": "Question",
        "name": "How does TravelGo calculate travel time?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "TravelGo uses the Haversine formula to calculate straight-line distance between your GPS position and the destination. It then estimates travel time using average speeds: 40 km/h for car, 25 km/h + 10 min buffer for bus, and 55 km/h + 15 min buffer for train."
        }
      },
      {
        "@type": "Question",
        "name": "Is TravelGo AI free to use?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. TravelGo AI is completely free with no sign-up, no subscription, and no hidden fees. It uses open-source APIs including OpenStreetMap Nominatim, Open-Meteo, Overpass API, and Wikipedia REST API."
        }
      },
      {
        "@type": "Question",
        "name": "Where does TravelGo get hotel data?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Hotel listings are sourced from OpenStreetMap via the Overpass API, querying for tourism=hotel, guest_house, and hostel nodes within a 10km radius of the searched destination."
        }
      },
      {
        "@type": "Question",
        "name": "Does TravelGo work outside India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. TravelGo works for any city worldwide. The underlying data sources — OpenStreetMap, Open-Meteo, and Wikipedia — have global coverage across 195 countries and 50,000+ cities."
        }
      },
      {
        "@type": "Question",
        "name": "How is the weather data sourced?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Weather data comes from the Open-Meteo API, a free and open-source weather service with 1km spatial resolution using the ERA5 reanalysis model and real-time forecast data."
        }
      },
      {
        "@type": "Question",
        "name": "Can I share a destination with others?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Use the share button to copy the destination URL to your clipboard. The URL includes the city parameter (e.g. ?city=Mumbai), so anyone who opens the link will see the same destination."
        }
      },
      {
        "@type": "Question",
        "name": "Does TravelGo require location access?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Location access is optional. Granting it allows TravelGo to calculate travel distances from your current position. If denied, you can still search any destination and get weather, hotels, and city guides."
        }
      }
    ]
  }
  </script>
